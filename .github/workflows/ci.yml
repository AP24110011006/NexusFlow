name: NexusFlow CI

on:
  push:
    branches: [ main, manikanth, likhitha, harshitha ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Health Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Rule Engine Unit Tests
        run: node tests/ruleEngine.test.js

      - name: Run Telemetry Validation Tests
        run: node tests/telemetryValidation.test.js

      - name: Run Integration Tests
        run: node tests/integration.test.js

      - name: Run Backend Health Diagnostic
        run: node scripts/health-check.js

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Execute Vite Production Build
        run: npm run build
