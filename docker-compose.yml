version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusflow-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - CORS_ORIGIN=http://localhost:5173
      - JWT_SECRET=nexusflow-internship-secret-key-2026-infotact
      - SIMULATOR_ENABLED=true
      - SIMULATOR_INTERVAL_MS=3000
    volumes:
      - ./backend/data:/app/data
    networks:
      - nexusflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - nexusflow-net

networks:
  nexusflow-net:
    driver: bridge
